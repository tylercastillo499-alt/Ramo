<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo de Rosas Animado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff0f5; /* Fondo rosa pálido */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Contenedor del ramo */
        #ramo-container {
            width: 300px;
            height: 400px;
            position: relative;
            overflow: hidden; /* Para ocultar las flores inicialmente */
        }

        /* Estilos de las rosas (usando caracteres Unicode) */
        .rosa {
            font-size: 50px;
            color: #ff69b4; /* Rosa intenso */
            position: absolute;
            bottom: -50px; /* Posición inicial fuera del contenedor */
            transition: bottom 1s ease-in-out; /* Transición para la animación */
        }

        /* Botón para iniciar la animación */
        #animar-btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Un Ramo de Rosas para Ti!</h1>
        <div id="ramo-container">
            <!-- Las rosas se añadirán aquí dinámicamente con JavaScript -->
        </div>
        <button id="animar-btn">Ver Ramo</button>
    </div>

    <script>
        const ramoContainer = document.getElementById('ramo-container');
        const animarBtn = document.getElementById('animar-btn');

        // Función para crear y añadir rosas al ramo
        function crearRamo() {
            // Limpiar el contenedor si ya hay rosas
            ramoContainer.innerHTML = '';

            const numeroRosas = 10; // Número de rosas en el ramo

            for (let i = 0; i < numeroRosas; i++) {
                const rosa = document.createElement('span');
                rosa.classList.add('rosa');
                rosa.textContent = '🌹'; // Carácter Unicode de rosa

                // Posicionamiento aleatorio horizontal
                const xPos = Math.random() * (ramoContainer.offsetWidth - 50);
                rosa.style.left = `${xPos}px`;

                ramoContainer.appendChild(rosa);
            }
        }

        // Función para iniciar la animación
        function animarRamo() {
            crearRamo(); // Crear las rosas primero

            const rosas = document.querySelectorAll('.rosa');

            // Retraso para que las rosas suban una por una
            rosas.forEach((rosa, index) => {
                setTimeout(() => {
                    rosa.style.bottom = '10px'; // Posición final de las rosas
                }, index * 200); // 200ms de retraso entre cada rosa
            });
        }

        animarBtn.addEventListener('click', animarRamo);
    </script>
</body>
</html>
