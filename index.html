<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Este Ramo de Flores es Para Ti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #121722 0%, #05070a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            position: relative;
        }

        /* Estrellas de fondo */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration, 3s) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .shooting-star {
            position: absolute;
            top: 15%;
            left: -100px;
            width: 140px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1), rgba(255,255,255,0));
            border-radius: 50%;
            transform: rotate(-25deg);
            animation: shoot 5s infinite ease-in-out 1s;
            opacity: 0;
        }

        @keyframes shoot {
            0% { left: -100px; top: 15%; opacity: 0; }
            10% { opacity: 1; }
            25% { left: 110%; top: 40%; opacity: 0; }
            100% { left: 110%; top: 40%; opacity: 0; }
        }

        /* Título */
        .title-container {
            text-align: center;
            z-index: 10;
            margin-top: 10px;
            margin-bottom: 5px;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInTitle 2s ease forwards 0.3s;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.4rem, 5.5vw, 4.2rem);
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 182, 193, 0.9),
                         0 0 25px rgba(255, 105, 180, 0.7),
                         0 0 40px rgba(255, 105, 180, 0.4);
            letter-spacing: 1px;
            line-height: 1.2;
        }

        @keyframes fadeInTitle {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Contenedor del Ramo */
        .stage {
            position: relative;
            width: 420px;
            height: 560px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 5;
        }

        svg.bouquet-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Animaciones */
        .stem {
            stroke-dasharray: 450;
            stroke-dashoffset: 450;
            animation: growStem 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .leaf {
            transform-origin: center center;
            transform: scale(0);
            animation: popLeaf 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .flower-bud {
            transform-origin: center bottom;
            transform: scale(0);
            animation: bloomBud 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            filter: drop-shadow(0 0 16px rgba(255, 105, 180, 0.8));
        }

        .wrapper-paper {
            transform-origin: center bottom;
            transform: scaleY(0) scaleX(0.7);
            opacity: 0;
            animation: unfoldWrapper 1.4s cubic-bezier(0.165, 0.84, 0.44, 1) forwards 0.6s;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
        }

        .wrapper-ribbon {
            transform-origin: center center;
            transform: scale(0);
            animation: popRibbon 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 2.0s;
        }

        /* Retrasos escalonados */
        .stem-1 { animation-delay: 0.1s; }
        .stem-2 { animation-delay: 0.25s; }
        .stem-3 { animation-delay: 0.4s; }
        .stem-4 { animation-delay: 0.55s; }
        .stem-5 { animation-delay: 0.7s; }
        .stem-6 { animation-delay: 0.85s; }
        .stem-7 { animation-delay: 1.0s; }

        .leaf-group-1 { animation-delay: 1.1s; }
        .leaf-group-2 { animation-delay: 1.3s; }
        .leaf-group-3 { animation-delay: 1.5s; }

        .flower-1 { animation-delay: 1.6s; }
        .flower-2 { animation-delay: 1.75s; }
        .flower-3 { animation-delay: 1.9s; }
        .flower-4 { animation-delay: 2.05s; }
        .flower-5 { animation-delay: 2.2s; }
        .flower-6 { animation-delay: 2.35s; }
        .flower-7 { animation-delay: 2.5s; }

        @keyframes growStem {
            to { stroke-dashoffset: 0; }
        }

        @keyframes popLeaf {
            to { transform: scale(1); }
        }

        @keyframes bloomBud {
            0% { transform: scale(0) translateY(20px); opacity: 0; }
            70% { transform: scale(1.1) translateY(-3px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes unfoldWrapper {
            to {
                transform: scaleY(1) scaleX(1);
                opacity: 1;
            }
        }

        @keyframes popRibbon {
            to { transform: scale(1); }
        }

        /* Botón */
        .controls {
            z-index: 10;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .btn-replay {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }

        .btn-replay:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 20px rgba(255, 20, 147, 0.6);
        }

        /* Partículas de destellos */
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,182,193,0.8) 50%, rgba(255,105,180,0) 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            animation: floatUp var(--duration) ease-in infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.4); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translateY(-130px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stars-container" id="starsContainer"></div>
    <div class="shooting-star"></div>

    <div class="title-container">
        <h1 class="title">Este Ramo de Flores es Para Ti</h1>
    </div>

    <div class="stage" id="stage">
        <svg class="bouquet-svg" viewBox="0 0 400 550">
            <defs>
                <!-- Gradientes del Envoltorio (Estilo Kraft suave) -->
                <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f5d6ba"/>
                    <stop offset="50%" stop-color="#e2b997"/>
                    <stop offset="100%" stop-color="#c89973"/>
                </linearGradient>
                <linearGradient id="paperFoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#d3a078"/>
                    <stop offset="100%" stop-color="#b07d56"/>
                </linearGradient>

                <!-- Gradiente para Tallos Fuertes -->
                <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#2a5a22"/>
                    <stop offset="50%" stop-color="#4d8c42"/>
                    <stop offset="100%" stop-color="#1b3d16"/>
                </linearGradient>

                <!-- Gradientes para Hojas Verdes Vibrantes -->
                <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#5fa053"/>
                    <stop offset="50%" stop-color="#3c7a31"/>
                    <stop offset="100%" stop-color="#1e4417"/>
                </linearGradient>
                <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#73b666"/>
                    <stop offset="50%" stop-color="#46873b"/>
                    <stop offset="100%" stop-color="#234c1c"/>
                </linearGradient>

                <!-- Gradientes de Pétalos Estilo Tulipán/Capullo Rosa (Igual a la imagen) -->
                <radialGradient id="roseBudGrad" cx="50%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#ffb3da"/>
                    <stop offset="45%" stop-color="#ff4da6"/>
                    <stop offset="85%" stop-color="#e60073"/>
                    <stop offset="100%" stop-color="#99004d"/>
                </radialGradient>
                <linearGradient id="petalGlow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="30%" stop-color="#ff80bf"/>
                    <stop offset="100%" stop-color="#d6006e"/>
                </linearGradient>

                <!-- Gradiente para el Lazo Rosa -->
                <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffb8d9"/>
                    <stop offset="50%" stop-color="#ff66b2"/>
                    <stop offset="100%" stop-color="#cc0066"/>
                </linearGradient>

                <!-- Plantilla de Hoja Indivudual -->
                <g id="singleLeaf">
                    <path d="M 0 0 C -15 -20 -25 -45 0 -65 C 25 -45 15 -20 0 0 Z" fill="url(#leafGrad1)" stroke="#1a3b14" stroke-width="1"/>
                    <path d="M 0 0 C -2 -20 0 -45 0 -65" stroke="#73b666" stroke-width="1.5" fill="none" opacity="0.7"/>
                </g>

                <!-- Plantilla de Flor Capullo Estilo Imagen 2 -->
                <g id="flowerBud">
                    <!-- Cáliz/Base verde de la flor -->
                    <path d="M -12 15 C -15 35 15 35 12 15 C 8 2 12 -5 0 -8 C -12 -5 -8 2 -12 15 Z" fill="#3c7a31"/>
                    <path d="M -6 18 Q 0 32 6 18 Q 0 10 -6 18" fill="#5fa053"/>

                    <!-- Pétalos Traseros Extremos -->
                    <path d="M -24 5 C -35 -20 -20 -48 -8 -52 C 2 -55 12 -35 8 5 Z" fill="url(#roseBudGrad)" opacity="0.9"/>
                    <path d="M 24 5 C 35 -20 20 -48 8 -52 C -2 -55 -12 -35 -8 5 Z" fill="url(#roseBudGrad)" opacity="0.9"/>

                    <!-- Pétalos Principales del Capullo -->
                    <path d="M -22 10 C -32 -15 -18 -55 0 -60 C 18 -55 32 -15 22 10 C 12 30 -12 30 -22 10 Z" fill="url(#roseBudGrad)"/>

                    <!-- Pétalos Centrales Superpuestos con Borde Brillante -->
                    <path d="M -16 5 C -24 -15 -12 -52 0 -54 C 12 -52 24 -15 16 5 C 8 22 -8 22 -16 5 Z" fill="url(#petalGlow)"/>
                    <path d="M -10 2 C -16 -12 -8 -42 0 -45 C 8 -42 16 -12 10 2 C 5 15 -5 15 -10 2 Z" fill="url(#roseBudGrad)"/>
                    
                    <!-- Centro del capullo -->
                    <ellipse cx="0" cy="-22" rx="5" ry="12" fill="#ffc2e0" opacity="0.9"/>
                </g>
            </defs>

            <!-- TALLOS MÁS DENSOS Y POTENTES -->
            <g id="stemsGroup">
                <path class="stem stem-1" d="M 200 460 Q 198 300 200 130" stroke="url(#stemGrad)" stroke-width="8.5" fill="none" stroke-linecap="round"/>
                <path class="stem stem-2" d="M 195 450 Q 170 300 145 170" stroke="url(#stemGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path class="stem stem-3" d="M 205 450 Q 230 300 255 170" stroke="url(#stemGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path class="stem stem-4" d="M 190 440 Q 135 320 95 210" stroke="url(#stemGrad)" stroke-width="7.5" fill="none" stroke-linecap="round"/>
                <path class="stem stem-5" d="M 210 440 Q 265 320 305 210" stroke="url(#stemGrad)" stroke-width="7.5" fill="none" stroke-linecap="round"/>
                <path class="stem stem-6" d="M 185 430 Q 115 330 65 240" stroke="url(#stemGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>
                <path class="stem stem-7" d="M 215 430 Q 285 330 335 240" stroke="url(#stemGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>
            </g>

            <!-- FOLLAJE ABUNDANTE (HOJAS EN LOS TALLOS) -->
            <g id="leavesGroup">
                <!-- Capa Inferior de Hojas -->
                <g class="leaf leaf-group-1" transform="translate(145, 330) rotate(-45) scale(0.9)"><use href="#singleLeaf"/></g>
                <g class="leaf leaf-group-1" transform="translate(255, 330) rotate(45) scale(0.9)"><use href="#singleLeaf"/></g>
                <g class="leaf leaf-group-1" transform="translate(105, 350) rotate(-60) scale(0.85)"><use href="#singleLeaf"/></g>
                <g class="leaf leaf-group-1" transform="translate(295, 350) rotate(60) scale(0.85)"><use href="#singleLeaf"/></g>

                <!-- Capa Media de Hojas -->
                <g class="leaf leaf-group-2" transform="translate(170, 260) rotate(-35) scale(1.1)"><use href="#singleLeaf"/></g>
                <g class="leaf leaf-group-2" transform="translate(230, 260) rotate(35) scale(1.1)"><use href="#singleLeaf"/></g>
                <g class="leaf leaf-group-2" transform="translate(120, 280) rotate(-50) scale(1)"><use href="#singleLeaf"/></g>
                <g class="leaf leaf-group-2" transform="translate(280, 280) rotate(50) scale(1)"><use href="#singleLeaf"/></g>
                <g class="leaf leaf-group-2" transform="translate(75, 300) rotate(-65) scale(0.9)"><use href="#singleLeaf"/></g>
                <g class="leaf leaf-group-2" transform="translate(325, 300) rotate(65) scale(0.9)"><use href="#singleLeaf"/></g>

                <!-- Capa Superior de Hojas -->
                <g class="leaf leaf-group-3" transform="translate(185, 190) rotate(-20) scale(0.9)"><use href="#singleLeaf"/></g>
                <g class="leaf leaf-group-3" transform="translate(215, 190) rotate(20) scale(0.9)"><use href="#singleLeaf"/></g>
                <g class="leaf leaf-group-3" transform="translate(135, 210) rotate(-40) scale(0.95)"><use href="#singleLeaf"/></g>
                <g class="leaf leaf-group-3" transform="translate(265, 210) rotate(40) scale(0.95)"><use href="#singleLeaf"/></g>
            </g>

            <!-- ROSAS EN FORMA DE CAPULLO FLORECIENDO (7 FLORES BIEN DISTRIBUIDAS) -->
            <g id="flowersGroup">
                <!-- Flor 1: Centro Superior -->
                <g class="flower-bud flower-1" transform="translate(200, 125) scale(1.15)"><use href="#flowerBud"/></g>

                <!-- Flor 2: Izquierda Media Alta -->
                <g class="flower-bud flower-2" transform="translate(145, 165) scale(1.1) rotate(-10)"><use href="#flowerBud"/></g>

                <!-- Flor 3: Derecha Media Alta -->
                <g class="flower-bud flower-3" transform="translate(255, 165) scale(1.1) rotate(10)"><use href="#flowerBud"/></g>

                <!-- Flor 4: Izquierda Media -->
                <g class="flower-bud flower-4" transform="translate(95, 205) scale(1.05) rotate(-20)"><use href="#flowerBud"/></g>

                <!-- Flor 5: Derecha Media -->
                <g class="flower-bud flower-5" transform="translate(305, 205) scale(1.05) rotate(20)"><use href="#flowerBud"/></g>

                <!-- Flor 6: Izquierda Exterior Baja -->
                <g class="flower-bud flower-6" transform="translate(60, 235) scale(0.95) rotate(-30)"><use href="#flowerBud"/></g>

                <!-- Flor 7: Derecha Exterior Baja -->
                <g class="flower-bud flower-7" transform="translate(340, 235) scale(0.95) rotate(30)"><use href="#flowerBud"/></g>
            </g>

            <!-- ENVOLTORIO DE PAPEL KRAFT ELEGANTE -->
            <g id="wrapperGroup" class="wrapper-paper">
                <!-- Capa Trasera -->
                <path d="M 110 320 L 200 480 L 290 320 L 370 240 L 200 290 L 30 240 Z" fill="#b07d56" opacity="0.6"/>
                
                <!-- Solapas de la envoltura -->
                <path d="M 40 250 L 195 490 L 195 310 L 55 240 Z" fill="url(#paperFoldGrad)"/>
                <path d="M 360 250 L 205 490 L 205 310 L 345 240 Z" fill="url(#paperFoldGrad)"/>

                <!-- Frente Principal del Cono -->
                <polygon points="50,250 200,510 350,250 200,320" fill="url(#paperGrad)"/>
                
                <!-- Pliegue y Sombra Frontal -->
                <path d="M 50 250 Q 200 330 350 250 L 200 510 Z" fill="url(#paperFoldGrad)" opacity="0.35"/>
            </g>

            <!-- LAZO ROSA BONITO -->
            <g id="ribbonGroup" class="wrapper-ribbon">
                <!-- Cintas caídas -->
                <path d="M 195 435 Q 165 475 140 510 Q 158 515 185 475 Z" fill="url(#ribbonGrad)"/>
                <path d="M 205 435 Q 235 475 260 510 Q 242 515 215 475 Z" fill="url(#ribbonGrad)"/>
                
                <!-- Orejas del moño -->
                <path d="M 200 435 C 150 400 130 445 192 438 Z" fill="url(#ribbonGrad)"/>
                <path d="M 200 435 C 250 400 270 445 208 438 Z" fill="url(#ribbonGrad)"/>
                
                <!-- Nudo central -->
                <circle cx="200" cy="436" r="9" fill="#e60073"/>
                <circle cx="199" cy="435" r="7" fill="url(#ribbonGrad)"/>
            </g>
        </svg>
    </div>

    <div class="controls">
        <button class="btn-replay" onclick="replayAnimation()">Ver Animación de Nuevo 🌹</button>
    </div>

    <script>
        function createStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 70; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.animationDelay = `${Math.random() * 3}s`;
                container.appendChild(star);
            }
        }

        function createParticles() {
            const stage = document.getElementById('stage');
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    const size = Math.random() * 7 + 3;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.left = `${Math.random() * 300 + 60}px`;
                    particle.style.bottom = `${Math.random() * 220 + 160}px`;
                    particle.style.setProperty('--duration', `${Math.random() * 2 + 2.5}s`);
                    stage.appendChild(particle);

                    setTimeout(() => particle.remove(), 4500);
                }, i * 250 + 1200);
            }
        }

        function replayAnimation() {
            const stage = document.getElementById('stage');
            const content = stage.innerHTML;
            stage.innerHTML = '';
            setTimeout(() => {
                stage.innerHTML = content;
                createParticles();
            }, 50);
        }

        window.addEventListener('DOMContentLoaded', () => {
            createStars();
            createParticles();
        });
    </script>
</body>
</html>
